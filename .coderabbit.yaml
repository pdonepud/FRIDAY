# CodeRabbit configuration for FRIDAY.
#
# Philosophy: signal over noise. Chill profile matches the manual triage
# workflow (Fix Now / Fix Cheap / Defer / Dismiss) established in earlier
# PRs. Path filters mirror the ruff/pre-commit exclusions so CodeRabbit
# doesn't waste review budget on dormant HUD-era code that we've already
# decided not to maintain until (or unless) it's brought forward.
#
# Auto-fix / auto-commit features are deliberately NOT enabled. Every
# CodeRabbit suggestion must be read, understood, and applied by a
# human — this is a hard project rule, not a preference.

language: en-US
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Skip dormant HUD-era code (matches ruff extend-exclude + pre-commit
  # exclude regex), archived sprint docs, build artifacts, and generated
  # files. CodeRabbit is only useful on code we're actively maintaining.
  path_filters:
    - "!modules/**"
    - "!server/**"
    - "!ui/**"
    - "!friday.py"
    - "!config.py"
    - "!config.example.py"
    - "!scratchpad/**"
    - "!docs/archive/**"
    - "!docs/sprint_reports/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!coverage.xml"
    - "!**/htmlcov/**"

  # Per-path review priorities. Keeps CodeRabbit focused on what matters
  # for each surface rather than applying one generic checklist everywhere.
  path_instructions:
    - path: "agent/**/*.py"
      instructions: |
        This is FRIDAY's core voice-first agent package. Prioritize:
        (1) correctness of the conversation loop and API-client seam,
        (2) security around API keys and any user input,
        (3) stability of public interfaces (functions imported from
            other modules within agent/).
        Do not nag about docstring style — the project uses concise,
        purpose-first docstrings by convention.

    - path: "tests/**/*.py"
      instructions: |
        Focus on test correctness, isolation, and edge cases.
        Do not require docstrings on test functions or fixtures beyond
        a single descriptive line. Do not suggest adding type hints to
        test code. Mocking of external services (Anthropic API, future
        Deepgram / ElevenLabs) is expected and correct — do not flag it
        as "should be an integration test."

    - path: ".github/workflows/**"
      instructions: |
        Focus on CI/CD security: least-privilege token permissions,
        pinned action versions (or major-version tags for trusted
        first-party actions like actions/checkout, actions/setup-python,
        codecov/codecov-action), and secret handling. Do not suggest
        matrix expansion beyond Python 3.11 and 3.12 unless the project
        adds an explicit third target.

    - path: "**/*.md"
      instructions: |
        Documentation-only files. Flag broken links, factual errors,
        and inconsistencies with AGENT.md. Do not suggest structural
        rewrites of README or CLAUDE.md — those follow project-specific
        conventions.

  # Tools: enable only what the project actually uses. Ruff is our
  # single Python linter/formatter (see pyproject.toml). Everything
  # else stays disabled to keep the review focused on human-relevant
  # findings.
  tools:
    ruff:
      enabled: true
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    hadolint:
      enabled: false
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true

  abort_on_close: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
