<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRIDAY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Boot sequence — visible on launch, fades out -->
  <div id="boot" class="boot-active">
    <h1 id="boot-title">
      <span>F</span><span>.</span><span>R</span><span>.</span><span>I</span><span>.</span><span>D</span><span>.</span><span>A</span><span>.</span><span>Y</span>
    </h1>
    <p id="boot-status">INITIALIZING SYSTEMS</p>
  </div>

  <!-- Main dashboard — hidden during boot, revealed after -->
  <main id="app" class="app-hidden">
    <!-- Calendar panel — left side -->
    <section class="panel panel-calendar" id="panel-calendar">
      <header class="panel-header">
        <span class="panel-label">TODAY</span>
        <span class="panel-status" id="calendar-status" role="status" aria-live="polite" aria-atomic="true">·</span>
      </header>
      <div class="panel-body" id="calendar-body">
        <div class="panel-loading">Connecting...</div>
      </div>
    </section>

    <!-- Weather panel — top right -->
    <section class="panel panel-weather" id="panel-weather">
      <header class="panel-header">
        <span class="panel-label">WEATHER</span>
        <span class="panel-status" id="weather-status" role="status" aria-live="polite" aria-atomic="true">·</span>
      </header>
      <div class="panel-body" id="weather-body">
        <div class="panel-loading">Connecting...</div>
      </div>
    </section>

    <!-- Watchlist panel — right column, between weather and actions -->
    <section class="panel panel-watchlist" id="panel-watchlist">
      <header class="panel-header">
        <span class="panel-label">MARKETS</span>
        <span class="panel-status" id="watchlist-status" role="status" aria-live="polite" aria-atomic="true">·</span>
      </header>
      <div class="panel-body" id="watchlist-body">
        <div class="panel-loading">Connecting...</div>
      </div>
    </section>

    <!-- Actions panel — bottom right -->
    <section class="panel panel-actions" id="panel-actions">
      <header class="panel-header">
        <span class="panel-label">ACTIONS</span>
        <span class="panel-status" id="briefing-status" role="status" aria-live="polite" aria-atomic="true">·</span>
      </header>
      <div class="panel-body">
        <button id="briefing-button" class="action-button" type="button">
          Run Briefing
        </button>
        <div id="briefing-message" class="action-message"></div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
