[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY — personal voice assistant."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.dynamic]
dependencies = { file = "agent/requirements.txt" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agent"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Pre-pivot HUD-era code (modules/, server/, ui/, friday.py, config.*) is
# dormant per CLAUDE.md and not part of Tier-2+ scope. Excluded from
# ruff so this PR's lint job doesn't gate on drift in code the pivot
# stopped maintaining.
extend-exclude = [
    "modules",
    "server",
    "ui",
    "friday.py",
    "config.py",
    "config.example.py",
    "scratchpad",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
# README.md: ruff v0.15 flags markdown content (line 121); markdown is
# not ruff's job, exclude it to unblock CI.
exclude = ["README.md"]
