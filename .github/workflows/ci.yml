name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            agent/requirements.txt

      - name: Install PortAudio (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format --check
        run: python -m ruff format --check .

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            agent/requirements.txt

      - name: Install PortAudio + PulseAudio (Ubuntu)
        # pulseaudio added 2026-10-24: ubuntu-latest image refresh
        # between 2026-10-22 and 2026-10-24 changed PortAudio's
        # PulseAudio-detection behaviour. Pa_Initialize() (called at
        # ``import sounddevice`` module load) now raises PaErrorCode
        # -9999 "Unanticipated host error: PulseAudio_Initialize:
        # Can't connect to server" instead of falling through to the
        # ALSA/dummy backend. Install pulseaudio and start it with
        # --exit-idle-time=-1 so it stays up for the whole job and
        # satisfies PortAudio's probe. Lint job doesn't import
        # sounddevice (ruff parses, doesn't execute) so stays on the
        # libportaudio2-only step. Mirrors the #49 pynput headless-fix
        # precedent (which used an env var; PortAudio has no
        # equivalent).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 pulseaudio
          pulseaudio --start --exit-idle-time=-1

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: pytest with coverage
        run: python -m pytest --cov=agent --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
